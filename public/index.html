<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Team Availability Tracker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #f1f5f9; min-height: 100vh; color: #1e293b; padding: 24px 16px; }
  .container { max-width: 1100px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  h1 { color: #4338ca; font-size: 1.5rem; }
  .live { font-size: .8rem; color: #64748b; display: flex; align-items: center; gap: 6px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #22c55e; animation: pulse 2s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stat { background: #fff; border-radius: 12px; padding: 14px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  .stat b { display: block; font-size: 1.6rem; }
  .filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
  .filters input, .filters select { padding: 10px; border: 1px solid #cbd5e1; border-radius: 10px; font: inherit; background: #fff; }
  .filters input { flex: 1; min-width: 180px; }
  #grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  .card { background: #fff; border-radius: 14px; padding: 16px; box-shadow: 0 3px 12px rgba(0,0,0,.07); border-top: 4px solid #cbd5e1; }
  .card.Available { border-top-color: #22c55e; } .card.Busy { border-top-color: #ef4444; } .card.Away { border-top-color: #f59e0b; }
  .card h3 { margin-bottom: 2px; }
  .meta { color: #64748b; font-size: .85rem; margin-bottom: 10px; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: .78rem; font-weight: 700; margin-bottom: 10px; }
  .badge.Available { background: #dcfce7; color: #15803d; } .badge.Busy { background: #fee2e2; color: #b91c1c; } .badge.Away { background: #fef3c7; color: #b45309; }
  .toggles { display: flex; gap: 6px; }
  .toggles button { flex: 1; border: 1px solid #cbd5e1; background: #f8fafc; border-radius: 8px; padding: 6px 0; font: inherit; font-size: .78rem; cursor: pointer; }
  .toggles button.active { background: #4338ca; border-color: #4338ca; color: #fff; }
  .toggles button:hover:not(.active) { background: #e2e8f0; }
  .empty, .err { text-align: center; padding: 24px; color: #64748b; grid-column: 1 / -1; }
  .err { color: #b91c1c; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>👥 Team Availability Tracker</h1>
    <div class="live"><span class="dot"></span><span id="updated">Live · connecting...</span></div>
  </header>

  <div class="summary" id="summary"></div>

  <div class="filters">
    <input id="search" type="search" placeholder="Search team member..." />
    <select id="status"><option value="">All statuses</option><option>Available</option><option>Busy</option><option>Away</option></select>
    <select id="role"><option value="">All roles</option><option>Design</option><option>Engineering</option><option>Product</option><option>QA</option></select>
  </div>

  <div id="grid"></div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const STATUSES = ["Available", "Busy", "Away"];

  function localTime(tz) {
    try { return new Intl.DateTimeFormat([], { hour: "2-digit", minute: "2-digit", timeZone: tz }).format(new Date()); }
    catch { return ""; }
  }

  function renderSummary(s) {
    $("summary").innerHTML = "";
    [["Total", s.total, "#4338ca"], ["Available", s.Available, "#15803d"], ["Busy", s.Busy, "#b91c1c"], ["Away", s.Away, "#b45309"]].forEach(([label, n, color]) => {
      const d = document.createElement("div"); d.className = "stat";
      const b = document.createElement("b"); b.textContent = n; b.style.color = color;
      d.append(b, label); $("summary").appendChild(d);
    });
  }

  function renderGrid(list) {
    const grid = $("grid");
    grid.innerHTML = "";
    if (!list.length) { grid.innerHTML = '<div class="empty">No team members match your filters.</div>'; return; }
    list.forEach((m) => {
      const card = document.createElement("div"); card.className = "card " + m.status;
      const h = document.createElement("h3"); h.textContent = m.name;
      const meta = document.createElement("div"); meta.className = "meta";
      meta.textContent = m.role + " · " + m.timezone + " · " + localTime(m.timezone);
      const badge = document.createElement("span"); badge.className = "badge " + m.status; badge.textContent = "● " + m.status;
      const toggles = document.createElement("div"); toggles.className = "toggles";
      STATUSES.forEach((s) => {
        const b = document.createElement("button");
        b.textContent = s; if (s === m.status) b.className = "active";
        b.onclick = () => setStatus(m.id, s);
        toggles.appendChild(b);
      });
      card.append(h, meta, badge, toggles);
      grid.appendChild(card);
    });
  }

  async function refresh() {
    try {
      const params = new URLSearchParams({ search: $("search").value, status: $("status").value, role: $("role").value });
      const [m, s] = await Promise.all([fetch("/api/members?" + params), fetch("/api/summary")]);
      if (!m.ok || !s.ok) throw new Error();
      renderGrid(await m.json());
      renderSummary(await s.json());
      $("updated").textContent = "Live · updated " + new Date().toLocaleTimeString();
    } catch {
      $("updated").textContent = "Connection lost, retrying...";
    }
  }

  async function setStatus(id, status) {
    try {
      const res = await fetch("/api/members/" + id + "/status", {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ status }),
      });
      if (!res.ok) throw new Error();
      refresh();
    } catch { alert("Could not update status. Please try again."); }
  }

  let t; $("search").oninput = () => { clearTimeout(t); t = setTimeout(refresh, 250); };
  $("status").onchange = refresh;
  $("role").onchange = refresh;

  refresh();
  setInterval(refresh, 5000); // live auto-refresh
</script>
</body>
</html>
